services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: gitopsdb
      POSTGRES_USER: gitops
      POSTGRES_PASSWORD: gitopspass
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitops -d gitopsdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: argocd-gitops-api:v1
    environment:
      DATABASE_URL: postgres://gitops:gitopspass@postgres:5432/gitopsdb?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data: